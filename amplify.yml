# AWS Amplify Hosting build spec for lloydgerry.com.
#
# Astro builds to static files in dist/. Node comes from .nvmrc so the build
# matches local development.
#
# As with the fractional site: if Amplify stores this spec on the app at creation,
# later edits to customHeaders here are not read. Sync them with
# `aws amplify update-app --custom-headers` and redeploy.

version: 1

frontend:
  phases:
    preBuild:
      commands:
        - nvm install "$(cat .nvmrc)"
        - nvm use "$(cat .nvmrc)"
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*

customHeaders:
  - pattern: '**'
    headers:
      - key: Strict-Transport-Security
        value: 'max-age=63072000; includeSubDomains; preload'
      - key: X-Content-Type-Options
        value: 'nosniff'
      - key: Referrer-Policy
        value: 'strict-origin-when-cross-origin'
      - key: X-Frame-Options
        value: 'DENY'
      - key: Permissions-Policy
        value: 'geolocation=(), microphone=(), camera=()'

  # Astro fingerprints everything under /_astro/, so it can be cached for good.
  - pattern: '/_astro/*'
    headers:
      - key: Cache-Control
        value: 'public, max-age=31536000, immutable'

  - pattern: '/*.html'
    headers:
      - key: Cache-Control
        value: 'public, max-age=300, must-revalidate'
